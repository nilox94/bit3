name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-22.04
    outputs:
      bitc: ${{ steps.filter.outputs.bitc }}
      bitlib: ${{ steps.filter.outputs.bitlib }}
      sh: ${{ steps.filter.outputs.sh }}
      sh_files: ${{ steps.sh-files.outputs.sh_files }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bitc:
              - 'bitc/**'
            bitlib:
              - 'bitlib/**'
            sh:
              - 'just/scripts/**'
              - 'just/common.just'
              - 'justfile'
      - uses: dorny/paths-filter@v3
        id: sh-files
        with:
          list-files: shell
          filters: |
            sh:
              - 'just/scripts/**/*.sh'

  sh-lint:
    name: sh — lint
    runs-on: ubuntu-22.04
    needs: changes
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      needs.changes.outputs.sh == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - run: just setup-sh
      - name: sh-lint (changed files)
        if: needs.changes.outputs.sh_files != ''
        run: just sh-lint ${{ needs.changes.outputs.sh_files }}
      - name: sh-lint (all scripts)
        if: needs.changes.outputs.sh_files == ''
        run: just sh-lint

  bitc:
    name: bitc — lint, build, test
    runs-on: ubuntu-22.04
    needs: changes
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      needs.changes.outputs.bitc == 'true'
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - run: just setup-rust
      - run: just setup-llvm --prefix "${{ runner.temp }}/llvm" --github-env
      - name: Satisfy linkage for LLVM binaries (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libtinfo5 zlib1g
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bitc
          shared-key: bitc
          cache-all-crates: true
      - run: just bitc-lint
      - run: just bitc-build
      - run: just bitc-test

  bitlib:
    name: bitlib — lint, build, test
    runs-on: ubuntu-22.04
    needs: changes
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      needs.changes.outputs.bitlib == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - run: just setup-lean --github-path
      - uses: actions/cache@v4
        with:
          path: bitlib/.lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('bitlib/lakefile.toml', 'bitlib/lake-manifest.json', 'bitlib/lean-toolchain') }}
      - run: just bitlib-lint
      - run: just bitlib-test
