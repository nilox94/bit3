name: bitlib

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    paths:
      - "bitlib/**"
      - ".github/workflows/bitlib.yml"

permissions:
  contents: read

jobs:
  ci:
    name: bitlib — build, lint, test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            bitlib/.lake
          key: ${{ runner.os }}-lean-${{ hashFiles('bitlib/lean-toolchain', 'bitlib/lake-manifest.json', 'bitlib/lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-lean-${{ hashFiles('bitlib/lean-toolchain', 'bitlib/lake-manifest.json') }}-
      - run: just setup-lean --github-path
      - run: just bitlib-build
      - run: just bitlib-lint -- --no-build
      - run: just bitlib-test
