name: Setup bitc CI
description: Checkout, toolchains, cached LLVM (runner.temp/llvm), rust-cache, and RUSTFLAGS for bitc jobs

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
    - name: Configure CI environment
      shell: bash
      run: |
        echo "LLVM_PREFIX=${{ runner.temp }}/llvm" >>"${GITHUB_ENV}"
        echo "RUSTFLAGS=-D warnings" >>"${GITHUB_ENV}"
    - uses: extractions/setup-just@v4
    - run: just setup-rust
      shell: bash
    - name: Satisfy linkage for LLVM binaries (Ubuntu)
      run: sudo apt-get update && sudo apt-get install -y libtinfo5 zlib1g
      shell: bash
    - uses: actions/cache@v5
      id: llvm-cache
      with:
        path: ${{ env.LLVM_PREFIX }}
        key: bitc-llvm-${{ hashFiles('just/scripts/llvm-version') }}
    - run: just setup-llvm --prefix "${LLVM_PREFIX}" --github-env
      shell: bash
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: bitc
        shared-key: bitc
        cache-all-crates: true
