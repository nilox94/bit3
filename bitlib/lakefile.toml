name = "bitlib"
version = "0.1.0"
defaultTargets = ["Bitlib"]
testDriver = "test"
lintDriver = "batteries/runLinter"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "v4.30.0"

[[lean_lib]]
name = "Bitlib"

# HoareTest contains compile-time proof examples (the factorial proof and
# the Hoare-logic acceptance criteria from issue #5). It is built as part
# of `lake test` so that proof regressions break CI.
[[lean_lib]]
name = "HoareTest"
srcDir = "test"

[[lean_exe]]
name = "test"
srcDir = "test"
root = "Main"
isTest = true
